<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand VRM Webpage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="toggleSettings()">Settings</button>
        <select id="mirrorSelect">
            <option value="none">None</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
        </select>
        <select id="vrmSelect">
            <!-- VRM options will be populated dynamically -->
        </select>
        <select id="fpsSelect">
            <option value="15">15 FPS</option>
            <option value="30">30 FPS</option>
            <option value="60">60 FPS</option>
        </select>
        <input type="range" id="sensitivitySlider" min="1" max="10" value="5">
    </div>
    <div id="settings" style="display:none;">
        <label for="mirrorSelect">Mirror:</label>
        <select id="mirrorSelectSettings">
            <option value="none">None</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
        </select>
        <label for="vrmSelectSettings">VRM:</label>
        <select id="vrmSelectSettings">
            <!-- VRM options will be populated dynamically -->
        </select>
        <label for="fpsSelectSettings">FPS:</label>
        <select id="fpsSelectSettings">
            <option value="15">15 FPS</option>
            <option value="30">30 FPS</option>
            <option value="60">60 FPS</option>
        </select>
        <label for="sensitivitySliderSettings">Sensitivity:</label>
        <input type="range" id="sensitivitySliderSettings" min="1" max="10" value="5">
        <button onclick="saveSettings()">Save</button>
    </div>
    <canvas id="webglCanvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/examples/js/loaders/GLTFAnimation.js"></script>
    <script>
        const canvas = document.getElementById('webglCanvas');
        const context = canvas.getContext('webgl');
        const controls = document.getElementById('controls');
        const settings = document.getElementById('settings');
        const mirrorSelect = document.getElementById('mirrorSelect');
        const vrmSelect = document.getElementById('vrmSelect');
        const fpsSelect = document.getElementById('fpsSelect');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const mirrorSelectSettings = document.getElementById('mirrorSelectSettings');
        const vrmSelectSettings = document.getElementById('vrmSelectSettings');
        const fpsSelectSettings = document.getElementById('fpsSelectSettings');
        const sensitivitySliderSettings = document.getElementById('sensitivitySliderSettings');

        let scene, camera, renderer, animationMixer;
        let vrmModel;

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            scene.background = new THREE.Color(0xffffff);

            const loader = new THREE.GLTFLoader();
            const gltf = await loader.load('./VRM/01.vrm');
            vrmModel = gltf.scene;

            scene.add(vrmModel);
            camera.position.z = 5;

            animationMixer = new THREE.AnimationMixer(vrmModel);
            const action = animationMixer.clipAction(gltf.animations[0]);
            action.play();

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            animationMixer.update(1 / 60);
            renderer.render(scene, camera);
        }

        function toggleSettings() {
            if (settings.style.display === 'none') {
                settings.style.display = 'block';
                controls.style.display = 'none';
            } else {
                settings.style.display = 'none';
                controls.style.display = 'block';
            }
        }

        function saveSettings() {
            mirrorSelect.value = mirrorSelectSettings.value;
            vrmSelect.value = vrmSelectSettings.value;
            fpsSelect.value = fpsSelectSettings.value;
            sensitivitySlider.value = sensitivitySliderSettings.value;
            toggleSettings();
        }

        async function loadVRMFiles() {
            const vrmDir = './VRM';
            const vrmSelect = document.getElementById('vrmSelect');
            const vrmSelectSettings = document.getElementById('vrmSelectSettings');

            const response = await fetch(vrmDir);
            const files = await response.text();
            const parser = new DOMParser();
            const htmlDoc = parser.parseFromString(files, 'text/html');
            const links = htmlDoc.querySelectorAll('a');

            links.forEach(link => {
                if (link.href.endsWith('.vrm')) {
                    const option = document.createElement('option');
                    option.value = link.href;
                    option.textContent = link.href;
                    vrmSelect.appendChild(option);
                    vrmSelectSettings.appendChild(option.cloneNode());
                }
            });
        }

        init();
        loadVRMFiles();
    </script>
</body>
</html>
