<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Tracking VRM Viewer (GitHub Pages Ready)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MediaPipe Hands CDN scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent; /* 透明背景 */
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
        }
        /* 確保背景層不會阻擋操作 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: transparent;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.5); border-radius: 3px; }
    </style>

    <!-- Import Maps (ES Modules) for Three.js & VRM v2 -->
    <!-- 確保版本對應一致，解決舊版 API 無法解析模型的問題 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body class="relative w-screen h-screen bg-slate-900/10">

    <!-- 3D Canvas Container (Transparent) -->
    <div id="canvas-container"></div>

    <!-- Hidden Video Preview for MediaPipe -->
    <video id="webcam-video" class="hidden" playsinline></video>

    <!-- UI Layer -->
    <div class="ui-layer w-full h-full flex flex-col justify-between p-4 sm:p-6 select-none">
        <!-- Top bar: Status -->
        <div class="flex justify-between items-center w-full">
            <div id="status-badge" class="interactive flex items-center gap-2 bg-slate-900/70 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50 shadow-lg text-xs sm:text-sm text-sky-400">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" id="status-dot"></span>
                <span id="status-text">初始化系統中...</span>
            </div>
            
            <button onclick="window.toggleHelpModal(true)" class="interactive bg-slate-900/70 hover:bg-slate-800 backdrop-blur-md text-slate-300 hover:text-white px-3.5 py-2 rounded-full border border-slate-700/50 shadow-lg text-xs sm:text-sm transition flex items-center gap-2">
                <i class="fa-brands fa-github"></i>
                <span class="hidden sm:inline">部署指南</span>
            </button>
        </div>

        <!-- Center tap hint -->
        <div id="tap-hint" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-500 opacity-80">
            <div class="bg-slate-950/60 backdrop-blur-md border border-slate-800 px-6 py-3 rounded-full text-xs sm:text-sm text-slate-300 shadow-2xl animate-bounce">
                👆 點擊畫面任意處開啟 / 關閉控制面板
            </div>
        </div>

        <div class="flex justify-between items-end w-full">
            <div class="text-xs text-slate-400 bg-slate-900/50 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-800/60 hidden sm:block">
                提示：僅啟用手部動補，無面部/身體捕捉。
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 transition-all duration-300 opacity-0 pointer-events-none scale-95">
        <div class="bg-slate-900/90 border border-slate-700/80 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-800 bg-slate-950/50">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-sky-400"></i> 設定面板
                </h2>
                <button onclick="window.toggleSettings(false)" class="text-slate-400 hover:text-white transition w-8 h-8 rounded-lg flex items-center justify-center hover:bg-slate-800">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto space-y-5 text-sm">
                <!-- Camera Select -->
                <div class="space-y-2">
                    <label class="block text-slate-300 font-medium">
                        <i class="fa-solid fa-video mr-1.5 text-sky-400"></i>鏡頭選擇
                    </label>
                    <select id="camera-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500 transition">
                        <option value="">載入可用鏡頭中...</option>
                    </select>
                </div>

                <!-- VRM Select -->
                <div class="space-y-2">
                    <label class="block text-slate-300 font-medium">
                        <i class="fa-solid fa-cube mr-1.5 text-sky-400"></i>VRM 模型
                    </label>
                    <select id="vrm-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500 transition">
                        <option value="./VRM/01.vrm">./VRM/01.vrm (專案預設)</option>
                        <option value="./VRM/02.vrm">./VRM/02.vrm</option>
                        <option value="custom">自訂上傳 (.vrm)...</option>
                    </select>
                    <input type="file" id="custom-vrm-input" accept=".vrm" class="hidden">
                </div>

                <!-- FPS Limiter -->
                <div class="space-y-2">
                    <label class="block text-slate-300 font-medium">
                        <i class="fa-solid fa-gauge-high mr-1.5 text-sky-400"></i>動補偵率 (FPS)
                    </label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="window.setFPS(15)" id="fps-15" class="fps-btn py-2 rounded-xl border border-slate-700 bg-slate-950 hover:bg-slate-800 text-slate-300 transition font-medium">15 FPS</button>
                        <button onclick="window.setFPS(30)" id="fps-30" class="fps-btn py-2 rounded-xl border border-sky-500 bg-sky-500/20 text-sky-300 transition font-medium">30 FPS</button>
                        <button onclick="window.setFPS(60)" id="fps-60" class="fps-btn py-2 rounded-xl border border-slate-700 bg-slate-950 hover:bg-slate-800 text-slate-300 transition font-medium">60 FPS</button>
                    </div>
                </div>

                <!-- Sensitivity -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-slate-300 font-medium">
                            <i class="fa-solid fa-hand mr-1.5 text-sky-400"></i>手部關節靈敏度
                        </label>
                        <span id="sensitivity-value" class="text-xs font-mono text-sky-400 bg-sky-950/60 px-2 py-0.5 rounded border border-sky-800/50">1.2x</span>
                    </div>
                    <input type="range" id="sensitivity-range" min="0.5" max="2.5" step="0.1" value="1.2" 
                           class="w-full h-2 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-sky-500">
                </div>
            </div>

            <div class="px-6 py-4 border-t border-slate-800 bg-slate-950/50 flex justify-end">
                <button onclick="window.toggleSettings(false)" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg">確認 / 關閉</button>
            </div>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="help-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 transition-all duration-300 opacity-0 pointer-events-none scale-95">
        <div class="bg-slate-900/95 border border-slate-700/80 w-full max-w-lg rounded-2xl shadow-2xl p-6 text-slate-300">
            <h2 class="text-lg font-semibold text-white mb-4"><i class="fa-brands fa-github text-sky-400"></i> GitHub Pages 部署注意</h2>
            <p class="text-sm mb-4">確保專案資料夾結構如下，以讓預設模型正常載入：</p>
            <pre class="bg-slate-950 p-3 rounded-xl text-xs text-sky-300 border border-slate-800 mb-4 font-mono">my-repo/
├── index.html
└── VRM/
    ├── 01.vrm
    └── 02.vrm</pre>
            <div class="flex justify-end">
                <button onclick="window.toggleHelpModal(false)" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl transition">了解</button>
            </div>
        </div>
    </div>

    <!-- Main Module Script -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // 使用 VRM v2 的正確導入方式
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- 狀態管理 ---
        let scene, camera, renderer, controls, currentVrm;
        let hands, cameraStream;
        let targetFPS = 30;
        let handSensitivity = 1.2;
        let lastFrameTime = 0;
        let isSettingsOpen = false;

        const clock = new THREE.Clock();

        // DOM Elements
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const tapHint = document.getElementById('tap-hint');
        const settingsPanel = document.getElementById('settings-panel');
        const cameraSelect = document.getElementById('camera-select');
        const vrmSelect = document.getElementById('vrm-select');
        const customVrmInput = document.getElementById('custom-vrm-input');

        // --- 系統初始化 ---
        function init() {
            initThreeJS();
            initMediaPipeHands();
            setupUI();
            
            // 確保 renderer 建立後再開始動畫迴圈，避免 'render of undefined'
            animate();

            // 嘗試載入預設模型
            loadVRM('./VRM/01.vrm');
        }

        // --- Three.js 設置 ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
            camera.position.set(0.0, 1.4, 1.8); // 對齊上半身/手部

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Three.js r154 使用 outputColorSpace
            renderer.outputColorSpace = THREE.SRGBColorSpace; 
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0.0, 1.3, 0.0);
            controls.update();

            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1.0, 1.0, 1.0).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 載入 VRM v2 模型 ---
        function loadVRM(url) {
            updateStatus('amber', `載入模型中 (${url})...`);
            
            const loader = new GLTFLoader();
            loader.crossOrigin = 'anonymous';

            // 註冊 VRM Plugin (v2 必備)
            loader.register((parser) => {
                return new VRMLoaderPlugin(parser);
            });

            loader.load(
                url,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    if (!vrm) {
                        updateStatus('rose', '這不是有效的 VRM 模型');
                        return;
                    }

                    if (currentVrm) {
                        scene.remove(currentVrm.scene);
                        VRMUtils.deepDispose(currentVrm.scene);
                    }

                    // 移除不需要的節點並旋轉模型面向鏡頭
                    VRMUtils.removeUnnecessaryJoints(gltf.scene);
                    vrm.scene.rotation.y = Math.PI;

                    scene.add(vrm.scene);
                    currentVrm = vrm;

                    updateStatus('emerald', `模型載入成功 - 準備手部動補`);
                },
                (progress) => {
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        if (percent < 100) updateStatus('amber', `載入中... ${percent}%`);
                    }
                },
                (error) => {
                    console.error('載入失敗:', error);
                    updateStatus('rose', `找不到模型：${url} (請確認路徑或手動上傳)`);
                }
            );
        }

        // --- MediaPipe Hands 設置 ---
        function initMediaPipeHands() {
            const videoElement = document.getElementById('webcam-video');

            hands = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onHandResults);

            navigator.mediaDevices.enumerateDevices().then(devices => {
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `攝影機 ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                if (videoDevices.length > 0) startCamera(videoDevices[0].deviceId);
            }).catch(e => updateStatus('rose', '無法取得攝影機授權'));
        }

        function startCamera(deviceId) {
            const videoElement = document.getElementById('webcam-video');
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                video: deviceId ? { deviceId: { exact: deviceId } } : true
            }).then(stream => {
                cameraStream = stream;
                videoElement.srcObject = stream;
                videoElement.play();

                const cameraUtils = new window.Camera(videoElement, {
                    onFrame: async () => {
                        const now = performance.now();
                        if (now - lastFrameTime >= (1000 / targetFPS)) {
                            lastFrameTime = now;
                            await hands.send({ image: videoElement });
                        }
                    },
                    width: 640, height: 480
                });
                cameraUtils.start();
                updateStatus('emerald', '手部動補已啟動 (僅作用於手指)');
            }).catch(e => updateStatus('rose', '攝影機啟動失敗'));
        }

        // --- 核心：將 MediaPipe 對應到 VRM 骨骼 ---
        function onHandResults(results) {
            if (!currentVrm || !currentVrm.humanoid || !results.multiHandLandmarks) return;

            // 預設將手勢歸零（避免手離開畫面時卡在奇怪的角度）
            // 注意：實作中如果沒有偵測到手，這裡不做清空以保持最後姿勢，依需求可調整。

            results.multiHandLandmarks.forEach((landmarks, index) => {
                const isRight = results.multiHandedness[index].label === 'Right';
                applyFingerRotation(landmarks, isRight);
            });
        }

        function applyFingerRotation(landmarks, isRight) {
            // VRM v2 的骨骼名稱為 camelCase
            const prefix = isRight ? 'right' : 'left';

            const mapFinger = (mcpIdx, pipIdx, dipIdx, boneName) => {
                const mcp = landmarks[mcpIdx], pip = landmarks[pipIdx], dip = landmarks[dipIdx];
                const v1 = { x: pip.x - mcp.x, y: pip.y - mcp.y, z: pip.z - mcp.z };
                const v2 = { x: dip.x - pip.x, y: dip.y - pip.y, z: dip.z - pip.z };
                
                const dot = v1.x*v2.x + v1.y*v2.y + v1.z*v2.z;
                const len1 = Math.sqrt(v1.x**2 + v1.y**2 + v1.z**2);
                const len2 = Math.sqrt(v2.x**2 + v2.y**2 + v2.z**2);
                
                if (len1 === 0 || len2 === 0) return;
                
                let cosAngle = Math.max(-1, Math.min(1, dot / (len1 * len2)));
                let angle = Math.acos(cosAngle) * handSensitivity;

                // 在 VRM v2 中，使用 getNormalizedBoneNode
                const proximal = currentVrm.humanoid.getNormalizedBoneNode(`${prefix}${boneName}Proximal`);
                const intermediate = currentVrm.humanoid.getNormalizedBoneNode(`${prefix}${boneName}Intermediate`);

                if (proximal) proximal.rotation.z = isRight ? -angle * 0.8 : angle * 0.8;
                if (intermediate) intermediate.rotation.z = isRight ? -angle : angle;
            };

            try {
                mapFinger(1, 2, 3, 'Thumb');
                mapFinger(5, 6, 7, 'Index');
                mapFinger(9, 10, 11, 'Middle');
                mapFinger(13, 14, 15, 'Ring');
                mapFinger(17, 18, 19, 'Little');
            } catch(e) {}
        }

        // --- 動畫迴圈 (安全執行) ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (currentVrm) currentVrm.update(delta);
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        // --- UI 控制與事件 ---
        function setupUI() {
            // 背景點擊開啟/關閉設定
            window.addEventListener('click', (e) => {
                if (e.target.closest('.interactive') || e.target.closest('#settings-panel') || e.target.closest('#help-modal')) return;
                window.toggleSettings(!isSettingsOpen);
            });

            cameraSelect.addEventListener('change', (e) => { if(e.target.value) startCamera(e.target.value); });
            
            vrmSelect.addEventListener('change', (e) => {
                if (e.target.value === 'custom') customVrmInput.click();
                else loadVRM(e.target.value);
            });

            customVrmInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadVRM(URL.createObjectURL(file));
            });

            document.getElementById('sensitivity-range').addEventListener('input', (e) => {
                handSensitivity = parseFloat(e.target.value);
                document.getElementById('sensitivity-value').innerText = `${handSensitivity.toFixed(1)}x`;
            });
        }

        function updateStatus(color, text) {
            statusText.innerText = text;
            statusDot.className = `w-2.5 h-2.5 rounded-full animate-pulse bg-${color}-400`;
        }

        // 曝露函數給 HTML inline onclick 使用
        window.toggleSettings = (open) => {
            isSettingsOpen = open;
            settingsPanel.style.opacity = open ? '1' : '0';
            settingsPanel.style.pointerEvents = open ? 'auto' : 'none';
            settingsPanel.style.transform = open ? 'scale(1)' : 'scale(0.95)';
            tapHint.style.opacity = open ? '0' : '0.8';
        };

        window.toggleHelpModal = (open) => {
            const modal = document.getElementById('help-modal');
            modal.style.opacity = open ? '1' : '0';
            modal.style.pointerEvents = open ? 'auto' : 'none';
            modal.style.transform = open ? 'scale(1)' : 'scale(0.95)';
        };

        window.setFPS = (fps) => {
            targetFPS = fps;
            document.querySelectorAll('.fps-btn').forEach(btn => {
                btn.className = "fps-btn py-2 rounded-xl border border-slate-700 bg-slate-950 hover:bg-slate-800 text-slate-300 transition font-medium";
            });
            document.getElementById(`fps-${fps}`).className = "fps-btn py-2 rounded-xl border border-sky-500 bg-sky-500/20 text-sky-300 transition font-medium";
        };

        // 啟動程式
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
